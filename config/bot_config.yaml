# config/bot_config.yaml

binance:
  # Влияние: без правильных ключей бот работает только в режиме "virtual".
  api_key: "YOUR_API_KEY_HERE"
  api_secret: "YOUR_API_SECRET_HERE"

  # Список прокси (http или socks5)
  # Как работает: бот будет использовать эти прокси при всех запросах к Binance.
  # Когда нужно: если Binance блокирует твой IP или сервер.
  # Влияние: повышает стабильность, но немного увеличивает задержку (latency_ms).
  proxies: []

trading:
  # Режим работы бота
  # virtual — бот торгует "на бумаге", реальные деньги не трогаются (идеально для тестов)
  # real — бот торгует реальными деньгами (есть риск потери депозита)
  # Рекомендация: сначала всегда ставь "virtual"
  mode: "virtual"

  # Режим расчёта риска на сделку
  # fixed — фиксированный процент от депозита (risk_pct)
  # auto — риск рассчитывается автоматически по формуле ТЗ: риск = (длина TP / длина SL)
  # Как работает: при "auto" бот сам подстраивает размер позиции под текущий RR сделки.
  # Влияние: "auto" даёт более адаптивный риск, "fixed" — стабильный и предсказуемый.
  risk_mode: "auto"

  # Процент риска от депозита (используется только при risk_mode: fixed)
  # Как работает: размер позиции рассчитывается так, чтобы при срабатывании SL потеря была ровно risk_pct * deposit.
  # Пример: депозит 10000$, risk_pct = 0.01 → максимальная потеря на сделку 100$.
  # Влияние: 0.005 — очень осторожно; 0.02 — агрессивно.
  risk_pct: 0.005

  # Дневной лимит убытка в % от депозита
  # Как работает: если за день убыток превысил этот процент — бот перестаёт открывать новые позиции до следующего дня.
  # Влияние: 0.03 — сильная защита; 0.08 — больше риска за день.
  daily_loss_limit: 0.06

  # Максимальное количество одновременно открытых позиций
  # Как работает: бот не откроет больше этого количества позиций одновременно на всех монетах.
  # Влияние: 2 — очень осторожно; 5–8 — можно торговать больше монет параллельно.
  max_open_positions: 12

  # Максимальное плечо, которое бот может использовать
  # Как работает: ограничивает leverage при открытии позиции.
  # Влияние: 20 — безопасно; 50 — агрессивно (больше прибыль, но выше риск ликвидации).
  max_leverage: 50

  # Минимальная сумма позиции в USDT
  # Как работает: бот не откроет позицию, если объём сделки в долларах меньше этой суммы.
  # Почему в USDT: чтобы риск на BTC и на SHIB был одинаковый в деньгах.
  # Влияние: 50 — можно торговать мелкие монеты; 300 — только крупные сделки.
  min_position_size_usdt: 18.0

  # === Trailing Stop ===
  # Режим активации трейлинга
  # manual — используешь trailing_activation_pct (фиксированный %)
  # auto — активация трейлинга = % от TP (например, если TP = 2%, трейлинг активируется при 2%)
  # Как работает: когда прибыль достигает указанного уровня, бот начинает двигать SL за ценой.
  trailing_mode: "auto"
  trailing_activation_pct: 0.015      # 1.5% от цены входа (только при manual)
  trailing_distance_pct: 0.004        # 0.8% от текущего максимума/минимума

  # Режим Take-Profit / Stop-Loss
  # classic — фиксированные уровни
  # partial_trailing — частичный трейлинг с уровнями фиксации
  # chandelier — ATR-based chandelier exit
  tp_sl_mode: "partial_trailing"

  # === Режим частичной фиксации (partial trailing) ===
  # auto — первый уровень = полный TP, второй уровень = TP/2, остаток позиции остаётся на trailing (автоматически подстраивается под текущий рынок)
  # manual — уровни и объёмы фиксации задаются вручную в partial_tp_levels и partial_tp_volumes
  # Как работает: в auto-режиме бот сам закрывает 50% на TP и 30% на TP/2, остаток 20% тянет трейлингом.
  # Влияние: auto — удобнее для новичка, manual — полный контроль.
  partial_trailing_mode: "auto"

  # Уровни частичной фиксации позиции (только при partial_trailing)
  # 0.5 = закрыть 50% позиции при первом уровне
  # 0.75 = закрыть ещё 25% при втором уровне
  partial_tp_levels: [0.5, 0.75]

  # Объём фиксации для каждого уровня (в % от позиции)
  # 50 = закрыть 50% на первом уровне, 25% на втором
  partial_tp_volumes: [50, 25]

  # Множители TP и SL (по умолчанию 1.0)
  # Как работает: tp_multiplier умножается на ATR при расчёте TP
  # sl_multiplier умножается на ATR при расчёте SL
  tp_multiplier: 1.0
  sl_multiplier: 1.0

  # Минимальная вероятность сигнала
  min_prob: 0.65          # для обычных аномалий C/V/CV
  min_prob_q: 0.75        # отдельный порог для тихого режима Q (строже)

  # Минимальный confidence модели после MC-Dropout
  # Как работает: модель выдаёт вероятность после 20 проходов с dropout.
  # min_confidence — это порог, ниже которого сигнал полностью игнорируется.
  # Для новичка: это фильтр качества. 0.65 = баланс. Ниже 0.6 — больше сделок, но больше ошибок. Выше 0.75 — меньше сделок, но выше качество.
  min_confidence: 0.65

  # Комиссия и проскальзывание (для реализма расчётов)
  commission: 0.0004
  slippage_pct: 0.0005

  # Час UTC сброса дневного лимита убытка
  # Как работает: каждый день в этот час обнуляется счётчик убытка.
  # 0 = 03:00 МСК (UTC+3). Можно поставить 21 — это 00:00 МСК.
  reset_daily_loss_hour: 0

  # Глобальные лимиты
  max_exposure_pct: 0.2               # максимум 30% депозита под все позиции

  # Моделируемая задержка исполнения ордера
  # Как работает: бот добавляет искусственную задержку в бэктесте и live.
  # 50 мс = 0.05 секунды (реалистичная задержка).
  latency_ms: 100

# ==================== МОДЕЛЬ ====================
model:
  # Размер скрытого слоя нейронной сети
  # Как работает: чем больше — тем сложнее модель может запоминать паттерны.
  # Влияние: 64 — быстро и просто; 128 — золотая середина; 256 — сложнее, но дольше обучается.
  hidden_size: 128

  # Dropout (регуляризация)
  # Как работает: случайно "выключает" часть нейронов во время обучения, чтобы модель не переобучалась.
  # Влияние: 0.2 — слабо; 0.3 — оптимально; 0.5 — очень сильно (модель проще).
  dropout: 0.3

  # Количество эпох обучения
  # Как работает: сколько раз модель проходит весь датасет.
  # Влияние: 20 — быстро; 30 — стандарт; 50 — дольше, но лучше качество.
  epochs: 40

  # Размер батча
  # Как работает: сколько примеров модель видит за один шаг обучения.
  # Влияние: 32 — быстрее, но менее стабильно; 64 — оптимально.
  batch_size: 64

  # Скорость обучения
  # Как работает: насколько сильно модель меняет веса за один шаг.
  # Влияние: 0.001 — быстро; 0.0005 — стабильнее.
  learning_rate: 0.00065

  # Количество проходов MC-Dropout при предсказании
  # Как работает: модель 20 раз "выключает" нейроны и усредняет результат.
  # Влияние: 10 — быстрее; 20 — точнее оценка уверенности.
  mc_dropout_passes: 20

  # Интервал переобучения модели
  # Как работает: каждые N дней бот переобучает модель на свежих данных.
  # Влияние: 7 — стандарт для крипты.
  retrain_interval_days: 7

  # Безрисковая ставка для расчёта Sharpe Ratio
  # Как работает: используется при расчёте качества модели.
  # Влияние: 0.0 — стандарт для крипты.
  risk_free_rate: 0.0

# ==================== БЭКТЕСТ ====================
backtest:
  # Количество независимых тестовых окон в walk-forward
  # Как работает: бот делит историю на 5 частей и 5 раз проверяет себя на разных отрезках.
  # Влияние: 3 — быстро; 5 — оптимально; 8 — очень надёжно, но дольше.
  walk_forward_windows: 6

  # Буфер между обучением и проверкой (embargo)
  # Как работает: между последней свечой обучения и первой свечой теста оставляется 20 свечей "пустого пространства".
  # Влияние: защита от утечки данных. 20 — оптимально.
  embargo_bars: 10

  # Количество свечей для бэктеста на каждом таймфрейме
  # Как работает: PR считается на последних 250 свечах каждого TF.
  # Влияние: 250 — оптимально для выявления лучших монет на данный момент.
  backtest_candles_per_tf: 250

# ==================== ДАННЫЕ ====================
data:
  # Максимальная история для скачивания (в месяцах)
  # Как работает: бот скачивает ровно 3 последних месяца данных.
  # Влияние: модель обучается на 3 месяцах, как мы договаривались.
  max_history_months: 3

  # Количество свечей для warm-up при запуске бота
  # Как работает: перед началом торговли бот прогревается на 1000 свечах, чтобы понять текущее состояние рынка.
  # Влияние: 1000 — оптимально.
  warmup_candles: 250

  # Минимальный возраст монеты для включения в whitelist
  # Как работает: монеты младше 3 месяцев не рассматриваются.
  # Влияние: защита от новых и нестабильных токенов.
  min_age_months: 6

# ==================== HARDWARE ====================
hardware:
  # Профиль железа
  # Как работает: влияет на batch_size и max_workers.
  # Влияние: colab — средняя мощность; server — максимальная.
  profile: "colab"

  # Количество параллельных потоков
  # Как работает: сколько свечей бот может обрабатывать одновременно.
  # Влияние: 8 — оптимально для Colab; 16+ — для сервера.
  max_workers: 16

# ==================== СЦЕНАРИИ ====================
scenario_tracker:
  # Максимальное количество хранимых сценариев
  # Как работает: бот помнит до 100000 разных паттернов.
  # Влияние: больше = точнее веса, но больше памяти.
  max_scenarios: 100000

  # Байесовский приор побед
  # Как работает: каждый новый сценарий изначально считается выигравшим 1 раз.
  # Влияние: сглаживает редкие сценарии.
  bayesian_prior_wins: 1

  # Байесовский приор поражений
  # Как работает: каждый новый сценарий изначально считается проигравшим 3 раза.
  # Влияние: делает веса более консервативными.
  bayesian_prior_losses: 3

  # Период полураспада весов сценариев
  # Как работает: через 90 дней вес старого сценария уменьшается в 2 раза.
  # Влияние: 90 дней — оптимально для крипты.
  decay_half_life_days: 90

# ==================== ФИЛЬТРЫ ====================
filters:
  # Минимальный PR_LS для включения монеты в whitelist
  # Как работает: если PR ниже 1.3 — монета не торгуется.
  # Влияние: 1.2 — больше монет; 1.5 — строже.
  min_pr: 1

  # Минимальное количество сделок для включения монеты
  # Как работает: если сделок меньше 50 — монета не торгуется.
  # Влияние: 30 — больше монет; 50 — стандарт.
  min_trades: 5

  # Минимальное количество таймфреймов, подтверждающих сигнал
  # Как работает: минимум 2 таймфрейма должны увидеть одну и ту же аномалию.
  # Влияние: 2 — оптимально; 3 — строже.
  min_tf_consensus: 2

# ==================== ФИЧИ И ПРИЗНАКИ ====================
features:
  # Какие признаки использовать
  # all — все фичи включены
  # custom — можно указать список
  # Как работает: если "all" — бот использует все признаки.
  selection: "all"

  # Основной период сравнения половин свечей
  # Как работает: бот сравнивает первую и вторую половину этих свечей для определения тренда.
  # Влияние: 100 — стандарт.
  half_comparison_period: 100

  # Перцентиль объёма для аномалии
  # Как работает: объём выше 95-го перцентиля считается аномальным.
  volume_percentile: 95

  # На каких окнах считается перцентиль объёма
  volume_percentile_windows: [24, 50, 74, 100]

  # Value Area в процентах
  va_percentage: 60

  # Список всех окон для модели
  windows_list: [24, 50, 74, 100]

  # Список таймфреймов
  timeframes_list: ["1m", "3m", "5m", "10m", "15m"]

  # Период ценового канала
  price_channel_period: 100

paths:
  data_dir: "data"
  models_dir: "models"

logging:
  level: "INFO"
  file: "logs/bot.log"